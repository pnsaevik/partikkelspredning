[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partikkelspredning"
version = "0.1.4"
description = "Partikkelspredning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "email-validator",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "httpx2"]
local = ["uvicorn[standard]"]
# Only needed when PARTIKKEL_STORAGE_MODE=azure is actually used (see
# src/partikkelspredning/composition.py) - not required for local
# development or the default test suite.
azure = ["azure-functions", "azure-data-tables", "azure-storage-queue", "azure-storage-blob"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "azure_integration: requires a real/emulated Azure Storage account; excluded by default (see tests/azure_integration/test_azure_adapters.py)",
]
addopts = "-m 'not azure_integration'"
filterwarnings = [
    # Raised from inside starlette/testclient.py's own module-level code (not
    # ours), which still references anyio's old `anyio.abc.BlockingPortal`
    # alias - deprecated in newer anyio releases in favor of
    # `anyio.from_thread.BlockingPortal`. This is a starlette/anyio version
    # mismatch to fix in those projects, not something addressable from our
    # dependencies, so it's ignored narrowly by message rather than pinning
    # an anyio/starlette version just to silence it.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]
