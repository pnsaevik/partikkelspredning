name: deploy

# Deploys api/ (the Azure Functions ASGI host for partikkelspredning.main:app -
# see api/README.md) to the existing Flex Consumption Function App
# `partikkelspredning-api` in resource group `partikkelspredning-rg`.
#
# Triggered by pushing a tag like v0.1.2, but only actually deploys if that
# tag's commit is reachable from main (see the verify job below) - a tag
# pushed from a feature branch, or any other stray tag, is refused rather
# than silently deploying unreleased code.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write # required so the nested `deploy` job (action_deploy.yml)
                  # can request it for OIDC login to Azure - a reusable
                  # workflow job can never be granted more than the caller
                  # itself has at the top level.

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history for the merge-base check below

      - name: Check tag matches pyproject.toml version
        # api/requirements.txt pins partikkelspredning==<version> and must
        # match [project].version in pyproject.toml (see api/README.md's
        # "How local packaging works") - build_vendor_wheel.sh (in
        # action_deploy.yml) will fail loudly if that pin is stale. This
        # additionally guards against tagging a release that doesn't match
        # the package version at all.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg_version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml version $pkg_version"
            exit 1
          fi

      - name: Check tag is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not on main - refusing to deploy"
            exit 1
          fi

  test:
    name: Test
    needs: verify
    uses: ./.github/workflows/action_pytest.yml

  deploy:
    name: Deploy
    needs: test
    uses: ./.github/workflows/action_deploy.yml
