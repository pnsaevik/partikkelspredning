name: Deploy to Azure Functions

# `app-name`/`environment` default to today's production target, so
# deploy.yml (which calls this with no `with:` block) is completely
# unaffected by these inputs existing - they only matter to a caller that
# deliberately overrides them (see deploy_staging.yml, which targets the
# separate `staging` GitHub environment and the `partikkelspredning-api-staging`
# Function App/resource group instead).
on:
  workflow_call:
    inputs:
      app-name:
        type: string
        default: partikkelspredning-api
      resource-group:
        type: string
        default: partikkelspredning-rg
      environment:
        type: string
        default: production

jobs:
  deploy:
    name: Deploy to Azure Functions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # required for OIDC login to Azure (azure/login)

    steps:
      - uses: actions/checkout@v7

      - name: Pin partikkelspredning to this commit in requirements.txt
        # Only api/ is uploaded to Azure below, so `..` (partikkelspredning's
        # own pyproject.toml) doesn't exist at install time - append a
        # git-based requirement pinned to the exact commit being deployed
        # instead, so it can never drift out of sync with what's actually
        # being tested. Edits only this run's checked-out copy of the file,
        # never committed back - see api/requirements.txt's comment.
        run: echo "partikkelspredning @ git+https://github.com/${{ github.repository }}.git@${{ github.sha }}" >> api/requirements.txt

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Disable the default Azure Functions placeholder homepage
        # Without this app setting, Azure intercepts bare `GET /` requests
        # with its own generic "Your Azure Function App is up and running."
        # placeholder page *before* they ever reach our routing - regardless
        # of any function registered for that route (here, the forms
        # registry's index page, api/function_app.py's `index`). Idempotent
        # (safe to run on every deploy) and unrelated to the smoke-test step
        # below, which hits `/health`, not `/`, so it wouldn't have caught
        # this.
        run: |
          az functionapp config appsettings set \
            --name ${{ inputs.app-name }} \
            --resource-group ${{ inputs.resource-group }} \
            --settings AzureWebJobsDisableHomepage=true \
            --output none

      - name: Deploy api/ to Azure Functions
        # partikkelspredning-api is on the Flex Consumption plan, which needs
        # `remote-build` (not `scm-do-build-during-deployment` /
        # `enable-oryx-build` - those are for the classic Consumption/Premium
        # plans and are explicitly documented as not to be set here). Without
        # it, Kudu skips the Oryx build ("remotebuild = false" in its deploy
        # log), nothing in requirements.txt gets installed, and the Python
        # worker silently indexes zero functions - the action still reports
        # success even though the app is left serving the default "up and
        # running" placeholder page. The smoke-test step below exists
        # specifically to catch that failure mode instead of trusting this
        # step's own success/failure signal.
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.app-name }}
          package: api
          sku: flexconsumption
          remote-build: true

      - name: Smoke-test the deployed app
        # Azure/functions-action can report success even when the app ends
        # up serving zero functions (see note above) - so verify directly
        # that a real route responds instead of trusting that step alone.
        run: |
          url="https://${{ inputs.app-name }}.azurewebsites.net/health"
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            if [ "$code" = "200" ]; then
              echo "OK: $url returned 200"
              exit 0
            fi
            echo "Attempt $i: $url returned $code, retrying..."
            sleep 15
          done
          echo "::error::$url never returned 200 - deployment likely did not take effect"
          exit 1

      - name: Smoke-test the forms registry index page (GET /)
        # Distinct from the /health check above: catches a regression of
        # the "Disable the default Azure Functions placeholder homepage"
        # step, where bare `GET /` silently falls back to Azure's generic
        # placeholder page instead of reaching our index route - which
        # /health alone would never notice, since it isn't the bare root.
        run: |
          url="https://${{ inputs.app-name }}.azurewebsites.net/"
          body="$(curl -s "$url")"
          if echo "$body" | grep -q "Available simulation forms"; then
            echo "OK: $url served the forms registry index page"
          else
            echo "::error::$url did not serve the forms registry index page (got Azure's default placeholder page instead?)"
            exit 1
          fi
