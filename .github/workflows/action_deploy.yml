name: Deploy to Azure Functions

on: workflow_call

jobs:
  deploy:
    name: Deploy to Azure Functions
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # required for OIDC login to Azure (azure/login)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build vendored partikkelspredning wheel
        # Only api/ is uploaded to Azure below, so partikkelspredning is
        # vendored as a wheel first - see api/README.md's "How local
        # packaging works" for why.
        run: |
          cd api
          ./build_vendor_wheel.sh

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy api/ to Azure Functions
        # partikkelspredning-api is on the Flex Consumption plan, which needs
        # `remote-build` (not `scm-do-build-during-deployment` /
        # `enable-oryx-build` - those are for the classic Consumption/Premium
        # plans and are explicitly documented as not to be set here). Without
        # it, Kudu skips the Oryx build ("remotebuild = false" in its deploy
        # log), nothing in requirements.txt gets installed, and the Python
        # worker silently indexes zero functions - the action still reports
        # success even though the app is left serving the default "up and
        # running" placeholder page. The smoke-test step below exists
        # specifically to catch that failure mode instead of trusting this
        # step's own success/failure signal.
        uses: Azure/functions-action@v1
        with:
          app-name: partikkelspredning-api
          package: api
          sku: flexconsumption
          remote-build: true

      - name: Smoke-test the deployed app
        # Azure/functions-action can report success even when the app ends
        # up serving zero functions (see note above) - so verify directly
        # that a real route responds instead of trusting that step alone.
        #
        # TEMPORARY: checks /api/hello (the minimal diagnostic endpoint from
        # api/function_app.py - see CHANGELOG.md's [0.1.4] entry) instead of
        # the real app's /api/openapi.json, since that's what's currently
        # deployed. Revert this alongside function_app.py once the real app
        # is restored, or this smoke test will pass against the wrong app.
        run: |
          url="https://partikkelspredning-api.azurewebsites.net/api/hello"
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            if [ "$code" = "200" ]; then
              echo "OK: $url returned 200"
              exit 0
            fi
            echo "Attempt $i: $url returned $code, retrying..."
            sleep 15
          done
          echo "::error::$url never returned 200 - deployment likely did not take effect"
          exit 1
